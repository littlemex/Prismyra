name: ci

# What this can and cannot prove.
#
# The hosted runners have no GPU, so the kernels never execute and **no performance regression can be caught here**. What
# is checked is the part that holds the measured results in place: the contract on questions and answers, the read-out's
# refusals, the padding arithmetic, and the adapter failing closed when it meets a model it was not measured on. The
# measured figures themselves live in benchmarks/results/*.json and are refreshed by hand on the machine named in each
# file; docs/PERFORMANCE.md says how.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.8
      - run: ruff check prismyra tests benchmarks
      - run: ruff format --check --diff prismyra tests benchmarks

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install without the CUDA wheels
        # The device-free tests need torch but not a CUDA build; the index below keeps the download to a tenth the size.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - run: pytest -q -m "not gpu"

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - run: mypy prismyra

  benchmarks-are-parseable:
    # The README's numbers are generated from these files, so a malformed one would publish a wrong table.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python benchmarks/check_results.py
