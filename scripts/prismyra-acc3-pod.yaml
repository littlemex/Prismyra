apiVersion: v1
kind: Pod
metadata:
  name: prismyra-acc3
  namespace: akazawt
  labels: {app: prismyra-acc3}
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  tolerations:
  - operator: Exists
  containers:
  - name: work
    image: vllm/vllm-openai:v0.27.1
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-lc"]
    args: ["nvidia-smi; echo READY; sleep infinity"]
    env:
    - {name: HF_HOME, value: /models/.hf}
    - {name: PYTHONUNBUFFERED, value: "1"}
    - {name: VLLM_USE_DEEP_GEMM, value: "0"}
    - {name: VLLM_ENABLE_V1_MULTIPROCESSING, value: "0"}
    resources:
      limits: {cpu: "32", memory: 200Gi, ephemeral-storage: 1000Gi, nvidia.com/gpu: "2"}
      requests: {cpu: "16", memory: 120Gi, ephemeral-storage: 900Gi, nvidia.com/gpu: "2"}
    volumeMounts:
    - {mountPath: /models, name: models}
    - {mountPath: /dev/shm, name: shm}
  volumes:
  - name: models
    emptyDir: {sizeLimit: 1000Gi}
  - name: shm
    emptyDir: {medium: Memory, sizeLimit: 32Gi}
